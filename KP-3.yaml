# ==========================================
# 1. 基础运行与网络端口
# ==========================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 30

# ==========================================
# 2. 客户端控制与面板
# ==========================================
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# ==========================================
# 3. 流量嗅探 Sniffer
# ==========================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.wechatapp.com"
    - "+.wechat.com"
    - "+.qq.com"

# ==========================================
# 4. TUN 虚拟网卡
# ==========================================
tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  mtu: 1500

# ==========================================
# 5. DNS 智能解析与防污染
# ==========================================
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  respect-rules: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: "fdfe:dcba:9876::1/64"
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  direct-nameserver:
    - "https://dns.alidns.com/dns-query#disable-qtype-65=true"
    - "https://doh.pub/dns-query#disable-qtype-65=true"

  direct-nameserver-follow-policy: false

  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#disable-qtype-65=true"
    - "https://doh.pub/dns-query#disable-qtype-65=true"

  nameserver-policy:
    "rule-set:private_domain,cn_domain,zhilian_11_list":
      - "https://dns.alidns.com/dns-query#disable-qtype-65=true"
      - "https://doh.pub/dns-query#disable-qtype-65=true"

    "rule-set:ai,geolocation-!cn,google_domain,youtube_domain,github_domain,telegram_domain,netflix_domain,tiktok_domain,my_custom_list,bg_md_list,c4_md_list,cams_md_list,cb_md_list,fanyi_1_list,lj_md_list,spt_md_list,st_md_list,stm_md_list":
      - "https://8.8.8.8/dns-query#Proxy&disable-qtype-65=true"
      - "https://1.1.1.1/dns-query#disable-qtype-65=true"

  nameserver:
    - "https://8.8.8.8/dns-query#Proxy&ecs=223.5.5.0/24&disable-qtype-65=true"

# ==========================================
# 6. 代理策略组（已适配直接读取客户端所有节点）
