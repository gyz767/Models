# ==========================================
# 1. 基礎運行與網絡端口段
# ==========================================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "127.0.0.1"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'strict'
keep-alive-idle: 600
keep-alive-interval: 30

# ==========================================
# 2. 客戶端控制與面板接口段
# ==========================================
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# ==========================================
# 3. 流量嗅探段 (Sniffer)
# ==========================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.wechatapp.com"
    - "+.wechat.com"
    - "+.qq.com"

# ==========================================
# 4. TUN 虛擬網卡接管段（電腦端全局 VPN 模式）
# ==========================================
tun:
  enable: true
  stack: gvisor
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  mtu: 1500

# ==========================================
# 5. DNS 智能解析与防污染
# ==========================================
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  use-hosts: false
  respect-rules: true
  ipv6: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: "fdfe:dcba:9876::1/64"

  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"

  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  nameserver:
    - "https://1.1.1.1/dns-query#Proxy"
    - "https://1.0.0.1/dns-query#Proxy"

  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5  

  nameserver-policy:
    "rule-set:private_domain,cn_domain,zhilian_11_list":
      - 119.29.29.29
      - 223.5.5.5

    "rule-set:ai,geolocation-!cn,google_domain,youtube_domain,github_domain,telegram_domain,netflix_domain,tiktok_domain,my_custom_list,bg_md_list,c4_md_list,cams_md_list,cb_md_list,fanyi_1_list,lj_md_list,spt_md_list,st_md_list,stm_md_list":
      - "https://1.1.1.1/dns-query#Proxy"
      - "https://1.0.0.1/dns-query#Proxy"

